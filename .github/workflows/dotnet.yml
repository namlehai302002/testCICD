name: WMS Tests CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: "8.0.x"
  CONFIG: "Release"

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Restore toàn solution
    - name: Restore solution
      run: dotnet restore WMS.sln

    # Build toàn solution
    - name: Build solution
      run: dotnet build WMS.sln --configuration ${{ env.CONFIG }} --no-restore

    # =========================
    # CHẠY TOÀN BỘ TEST TRONG WMS.Tests
    # (tự động detect tất cả Controllers/*.cs)
    # =========================
    - name: Run ALL tests in WMS.Tests
      run: dotnet test WMS.Tests/WMS.Tests.csproj --configuration ${{ env.CONFIG }} --no-build --verbosity normal

    # Optional: xuất report
    - name: Test Report
      run: dotnet test WMS.Tests/WMS.Tests.csproj --logger "trx;LogFileName=test-results.trx"
