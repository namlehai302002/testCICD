name: .NET CI/CD (WMS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # FIX: dùng csproj thay vì sln
    - name: Restore
      run: dotnet restore WMS.Tests.csproj

    - name: Build
      run: dotnet build WMS.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test WMS.Tests.csproj --no-build --configuration Release
